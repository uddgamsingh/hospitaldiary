name: Hospital data refresh & deploy
on:
  schedule: [{cron: "0 20 1,16 * *"}]   # 1st and 16th of each month, ~1:30 AM IST (GitHub uses UTC)
  push:                               # design change = quick redeploy using the saved data (no re-fetch)
    branches: [main]
    paths: [index.html, robots.txt]
  workflow_dispatch:
    inputs:
      states:
        description: "Optional: only refresh these state codes, e.g. TG KA (blank = all India)"
        required: false
        default: ""
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # The last good data lives on the 'data' branch (this is the backup). Missing on the very first run.
      - name: Restore saved data
        continue-on-error: true
        uses: actions/checkout@v4
        with: {ref: data, path: store}

      - name: Fetch, compare and update (keeps old data if anything fails)
        if: github.event_name != 'push'
        run: |
          mkdir -p store/data
          timeout 300m python3 fetch_hospitals.py --out store/data ${{ github.event.inputs.states }} || echo "Fetch step ended with code $? - continuing with saved data"
          cat store/data/run_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Check there is data to publish
        run: |
          test -s store/data/index.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('store/data/index.json'))['total']>0 else 1)"

      - name: Save data to the 'data' branch (backup)
        if: github.event_name != 'push'
        run: |
          cd store
          rm -rf .git
          git init -q -b data
          git config user.name "hospital-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Data snapshot $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -q -f origin data

      - name: Build site
        run: |
          mkdir -p site/data
          cp index.html robots.txt site/
          cp store/data/index.json store/data/*.dat site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
